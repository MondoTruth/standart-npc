<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5DA9E0"/>
      <stop offset="0.65" stop-color="#A9DBF5"/>
      <stop offset="1" stop-color="#E9F6FB"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#FFE9A8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAD7AE"/>
      <stop offset="1" stop-color="#C9AD7C"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8503F"/>
      <stop offset="1" stop-color="#8F2F27"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7A0"/>
      <stop offset="1" stop-color="#D9A233"/>
    </linearGradient>
    <g id="tower">
      <rect x="-22" y="0" width="44" height="120" fill="url(#wall)"/>
      <rect x="8" y="0" width="14" height="120" fill="#000" opacity="0.07"/>
      <polygon points="-30,2 0,-58 30,2" fill="url(#roof)"/>
      <rect x="-5" y="30" width="10" height="18" rx="5" fill="#3B2F4A" opacity="0.75"/>
      <line x1="0" y1="-58" x2="0" y2="-74" stroke="#7A5A2E" stroke-width="2"/>
      <polygon points="0,-74 16,-69 0,-64" fill="#E9B949"/>
    </g>
    <g id="cloud" fill="#FFFFFF">
      <ellipse cx="0" cy="0" rx="46" ry="16"/>
      <ellipse cx="-26" cy="-8" rx="24" ry="16"/>
      <ellipse cx="14" cy="-14" rx="28" ry="20"/>
    </g>
    <g id="spark" fill="#FFF3C4">
      <path d="M0,-9 L2,-2 L9,0 L2,2 L0,9 L-2,2 L-9,0 L-2,-2 Z"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="1200" height="320" fill="url(#sky)"/>
  <circle cx="930" cy="92" r="150" fill="url(#sun)"/>

  <!-- clouds -->
  <use href="#cloud" transform="translate(150 70) scale(1.1)" opacity="0.9"/>
  <use href="#cloud" transform="translate(1060 58) scale(0.9)" opacity="0.85"/>
  <use href="#cloud" transform="translate(760 130) scale(0.7)" opacity="0.7"/>
  <use href="#cloud" transform="translate(360 138) scale(0.6)" opacity="0.6"/>

  <!-- wings emblem behind title -->
  <g transform="translate(600 140) scale(1.3)" opacity="0.95">
    <g fill="#FFFFFF" stroke="#C9DDEB" stroke-width="1.5">
      <path d="M-40,0 C-90,-40 -170,-44 -236,-20 C-190,-16 -150,-4 -126,8 C-170,4 -212,12 -244,30 C-196,32 -150,34 -118,40 C-150,48 -182,62 -204,80 C-150,74 -96,56 -50,26 Z"/>
      <path d="M40,0 C90,-40 170,-44 236,-20 C190,-16 150,-4 126,8 C170,4 212,12 244,30 C196,32 150,34 118,40 C150,48 182,62 204,80 C150,74 96,56 50,26 Z"/>
    </g>
  </g>

  <!-- far hills -->
  <path d="M0,250 C120,215 240,228 360,240 C500,254 600,212 760,222 C900,231 1040,206 1200,228 L1200,320 L0,320 Z" fill="#9FC98A"/>
  <path d="M0,270 C160,248 300,262 460,258 C640,254 780,244 960,252 C1060,256 1140,250 1200,254 L1200,320 L0,320 Z" fill="#7DB36B"/>

  <!-- town: left side -->
  <g transform="translate(0 0)">
    <rect x="40" y="236" width="300" height="40" fill="url(#wall)"/>
    <g fill="url(#wall)">
      <rect x="40" y="226" width="16" height="12"/><rect x="72" y="226" width="16" height="12"/>
      <rect x="104" y="226" width="16" height="12"/><rect x="136" y="226" width="16" height="12"/>
      <rect x="168" y="226" width="16" height="12"/><rect x="200" y="226" width="16" height="12"/>
      <rect x="232" y="226" width="16" height="12"/><rect x="264" y="226" width="16" height="12"/>
      <rect x="296" y="226" width="16" height="12"/><rect x="324" y="226" width="16" height="12"/>
    </g>
    <use href="#tower" transform="translate(70 172) scale(0.9)"/>
    <use href="#tower" transform="translate(190 150) scale(1.1)"/>
    <use href="#tower" transform="translate(310 178) scale(0.8)"/>
  </g>

  <!-- town: right side, cathedral -->
  <g>
    <rect x="860" y="236" width="300" height="40" fill="url(#wall)"/>
    <g fill="url(#wall)">
      <rect x="860" y="226" width="16" height="12"/><rect x="892" y="226" width="16" height="12"/>
      <rect x="924" y="226" width="16" height="12"/><rect x="1080" y="226" width="16" height="12"/>
      <rect x="1112" y="226" width="16" height="12"/><rect x="1144" y="226" width="16" height="12"/>
    </g>
    <!-- cathedral body -->
    <rect x="950" y="150" width="120" height="100" fill="url(#wall)"/>
    <path d="M950,150 L1010,104 L1070,150 Z" fill="url(#roof)"/>
    <circle cx="1010" cy="140" r="14" fill="#3B2F4A" opacity="0.75"/>
    <circle cx="1010" cy="140" r="8" fill="#E9B949" opacity="0.9"/>
    <path d="M992,250 L992,208 A18,18 0 0 1 1028,208 L1028,250 Z" fill="#3B2F4A" opacity="0.8"/>
    <use href="#tower" transform="translate(944 132) scale(0.85)"/>
    <use href="#tower" transform="translate(1076 132) scale(0.85)"/>
    <use href="#tower" transform="translate(1150 176) scale(0.7)"/>
  </g>

  <!-- ground strip -->
  <rect x="0" y="274" width="1200" height="46" fill="#6AA35A"/>
  <path d="M0,274 L1200,274" stroke="#5A8F4B" stroke-width="2"/>

  <!-- title plate -->
  <g transform="translate(600 150)">
    <rect x="-230" y="-58" width="460" height="104" rx="14" fill="#22304A" opacity="0.88"/>
    <rect x="-222" y="-50" width="444" height="88" rx="10" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="50" font-weight="bold" fill="url(#gold)" letter-spacing="1">standart-npc</text>
    <text x="0" y="28" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="17" font-style="italic" fill="#E9F1F7">All-in-one NPC pack for Ragnarok Offline</text>
  </g>

  <!-- sparkles -->
  <use href="#spark" transform="translate(372 96) scale(1.2)"/>
  <use href="#spark" transform="translate(836 212) scale(0.9)"/>
  <use href="#spark" transform="translate(470 250) scale(0.8)"/>
  <use href="#spark" transform="translate(720 60) scale(1)"/>
  <use href="#spark" transform="translate(240 40) scale(0.7)"/>
</svg>
