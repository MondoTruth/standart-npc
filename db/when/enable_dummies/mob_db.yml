# standart-npc -- Training Dummy (Renewal)
# The dummy the Dummy Master puts up in Prontera. 28412 is the
# Normal-class dummy, 28413 the Boss-class one (Boss and both MVP
# choices): the class cannot be changed on a spawned monster, so it
# takes two entries. Size, element, race, DEF, MDEF and MVP mode are
# set by npc/when/enable_dummies/prontera_dummies.txt when it spawns;
# the values here are its defaults. Level and HP from rAthena's
# DUMMY_150 (2411, db/re/mob_db.yml in Flux159/rathena @ 7b526e6).
# KnockBackImmune keeps it on its cell. IDs are in the range the app's
# modding guide gives to mod monsters (25000-31998).
# Loaded only while "Training Dummies" (enable_dummies) is on.
# On Pre-renewal this file is replaced by
# pre-renewal/db/when/enable_dummies/mob_db.yml.

