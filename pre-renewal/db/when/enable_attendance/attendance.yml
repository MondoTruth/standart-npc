# standart-npc: Attendance Check rewards (Pre-renewal), by MondoTruth and Lil Art.
# rAthena's own attendance: the Attendance Check window, one reward a
# calendar day, sent by mail (RODEX). Progress is account-wide and a missed
# day does not reset it. One long period; with the attendance_repeat
# extension (extension_db.yml next to this file) the 20 days start over
# after day 20.
# The client shows the rewards from System/CheckAttendance.lub: keep both
# files the same. The Renewal copy is in db/when/enable_attendance/.
# Every day 1-20 must be here with an existing ItemId: one bad day drops the
# whole period (IDs checked against Flux159/rathena 5209ce0).

