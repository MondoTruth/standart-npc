<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>standart-npc</title>
<!--
  standart-npc settings window.

  Opened by Ragnarok Offline 1.3.4+ from Settings -> Mods -> Settings...
  Older apps ignore "settingsPage" and show the same options as plain
  checkboxes in the Mods tab, so nothing here is required for the mod to work.

  To add an NPC: give it a setting in mod.json as usual, then add its key to
  one of the groups below. A key that is in no group still appears, under
  "Other", so forgetting this step never hides an option.

  Warper, Job Master, Reset Girl, Stylist, Episode Valkyrie and Falcon
  Breeder are always loaded (npc/, not npc/when/) because a mod may declare
  only 20 settings.
  Here they look like any other NPC; their ticks are stored together in the
  one string setting "npc_off" (names of the unticked ones), which the NPCs
  read at start-up through F_SNPC_Off (npc/custom/snpc_settings.txt).

  The Buffer's buffs: "Choose buffs" next to the Buffer opens a second page
  (a settings page may not open windows). It writes the "buffer_set" string:
  the codes of the ticked buffs, which npc/when/enable_buffer/buffer.txt
  checks one by one. A new buff needs a line in BUFFS here and a block there.
-->
<style>
  :root { color-scheme: light dark; --dim: #8a8a8a; --line: #8884; --accent: #4a8fe7; --warn: #d08a2a; }
  * { box-sizing: border-box; }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 18px 20px 90px; }
  header h1 { font-size: 18px; margin: 0; }
  header p { color: var(--dim); margin: 2px 0 14px; font-size: 12px; }
  .off { color: var(--warn); }
  .tools { display: flex; gap: 8px; margin-bottom: 12px; }
  .tools button { font-size: 12px; padding: 3px 10px; }
  details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; list-style: none; user-select: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▶"; width: 1em; font-size: 11px; color: var(--dim); }
  details[open] > summary::before { content: "▼"; }
  summary .count { margin-left: auto; font-weight: 400; color: var(--dim); font-size: 12px; }
  label.row { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 0 26px; cursor: pointer; }
  label.row small { display: block; color: var(--dim); }
  input[type=checkbox] { accent-color: var(--accent); margin-top: 3px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 20px; display: flex; gap: 8px; align-items: center;
           background: Canvas; border-top: 1px solid var(--line); }
  footer button { padding: 6px 14px; }
  #status { color: var(--dim); font-size: 12px; margin-left: 6px; }
  #status.dirty { color: var(--warn); }
  label.row button { margin-left: 8px; font-size: 12px; padding: 1px 8px; }
  #buffs[hidden], #groups[hidden], .tools[hidden] { display: none; }
  #buffs h2 { font-size: 16px; margin: 0 0 4px; }
  #buffs > p { color: var(--dim); font-size: 12px; margin: 0 0 12px; }
  .excl { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>standart-npc</h1>
  <p id="about">Loading…</p>
</header>
<div class="tools">
  <button id="expand">Expand all</button>
  <button id="collapse">Collapse all</button>
</div>
<main id="groups"></main>
<main id="buffs" hidden>
  <div class="tools">
    <button id="buffs-back">← Back</button>
    <button id="buffs-default">Default set</button>
  </div>
  <h2>Buffer — choose buffs</h2>
  <p>Everything ticked is cast on click; the full heal always comes last. Buffs marked ⚠ cancel each other in the game, so only one of them can be on.</p>
  <div id="buff-groups"></div>
</main>
<footer>
  <button id="save">Save</button>
  <button id="apply">Save and restart server</button>
  <span id="status"></span>
</footer>

<script>
// Groups, in the order they are shown. Keys are the setting keys in mod.json.
// "npc:<name>" keys are the always-loaded NPCs from ALWAYS_LOADED below.
const GROUPS = [
  { title: 'Travel and services', keys: ['npc:warper', 'enable_buffer', 'enable_kafra', 'enable_weightmax'] },
  { title: 'Character',           keys: ['npc:jobmaster', 'npc:reset', 'npc:stylist', 'npc:epvalk', 'enable_plagiarism'] },
  { title: 'Shops',               keys: ['enable_tooldealer', 'enable_smuggler', 'enable_cardexchanger', 'npc:falcon'] },
  { title: 'Hunting quests',      keys: ['enable_bounties'] },
  { title: 'Dungeons',            keys: ['enable_mvp'] },
  { title: 'Equipment',           keys: ['enable_refiner', 'enable_enchanter', 'enable_nokzin'] },
  { title: 'Training',            keys: ['enable_dummies'] },
];

// NPCs without a setting of their own. The name after "npc:" is what goes
// into "npc_off" and what the NPC passes to F_SNPC_Off.
const OFF_KEY = 'npc_off';
const ALWAYS_LOADED = {
  'npc:warper':    { label: 'Warper',            description: 'Teleports to towns, fields and dungeons. Every major town, Prontera (160,192).' },
  'npc:jobmaster': { label: 'Job Master',        description: 'Job changes up to 4th class, with job equipment. Prontera (157,195).' },
  'npc:reset':     { label: 'Reset Girl',        description: 'Resets skills, stats, or both. Prontera (154,195).' },
  'npc:stylist':   { label: 'Stylist',           description: 'Hair style, hair color and cloth color. Prontera (169,180).' },
  'npc:epvalk':    { label: 'Episode Valkyrie',  description: 'Redeems Episode Clear Tickets from the Cash Shop. Prontera (128,193).' },
  'npc:falcon':    { label: 'Falcon Breeder',    description: 'Falcon for Hunters/Snipers, Wolf Flute for Rangers/Windhawks, Hawk Flute for Windhawks. Prontera (128,211).' },
};

// The Buffer's buffs, in casting order. code = what buffer.txt checks.
// excl: buffs with the same excl cancel each other; ticking one unticks the rest.
const BUFF_KEY = 'buffer_set';
const BUFF_DEFAULT = ['bless', 'agi', 'kyrie', 'magni'];
const BUFFS = [
  { job: 'Acolyte / Priest', list: [
    { code: 'bless',   label: 'Blessing',        text: 'Raises STR, DEX and INT.' },
    { code: 'agi',     label: 'Increase AGI',    text: 'Raises AGI and movement speed.' },
    { code: 'kyrie',   label: 'Kyrie Eleison',   text: 'A barrier that blocks several hits.' },
    { code: 'magni',   label: 'Magnificat',      text: 'Doubles natural SP recovery.' },
    { code: 'gloria',  label: 'Gloria',          text: '+30 LUK.' },
    { code: 'angelus', label: 'Angelus',         text: 'Raises VIT-based DEF.' },
    { code: 'impo',    label: 'Impositio Manus', text: '+25 weapon ATK (and MATK in Renewal).' },
    { code: 'suffra',  label: 'Suffragium',      text: 'Shorter cast time for your next spell.' },
    { code: 'assu',    label: 'Assumptio',       text: 'Greatly reduces damage taken.', excl: 'assu' },
  ]},
  { job: 'Crusader', list: [
    { code: 'provi',   label: 'Providence',      text: '+25% resistance to Holy damage and to Demon monsters.' },
  ]},
  { job: 'Blacksmith', list: [
    { code: 'wp',      label: 'Weapon Perfection', text: 'Full weapon damage against every monster size.' },
    { code: 'ot',      label: 'Over Thrust',       text: 'Raises weapon damage.' },
  ]},
  { job: 'Bard', list: [
    { code: 'bragi',   label: 'Poem of Bragi',   text: 'Shorter cast time and skill delay.' },
  ]},
  { job: 'Soul Linker', list: [
    { code: 'link',    label: 'Soul Link',       text: 'The spirit of your own class (2nd classes, and 1st classes after rebirth).', excl: 'soul' },
    { code: 'kaupe',   label: 'Kaupe',           text: 'Dodges the next few hits. 6 minutes.' },
    { code: 'kaizel',  label: 'Kaizel',          text: 'Revive on the spot with part of your HP after dying. 6 minutes.' },
    { code: 'kaahi',   label: 'Kaahi',           text: 'Heals you on every hit taken, for a little SP.' },
    { code: 'kaite',   label: 'Kaite',           text: 'Reflects spells back at the caster.', excl: 'assu' },
  ]},
  { job: 'Arch Bishop', list: [
    { code: 'expia',   label: 'Expiatio',        text: 'Your attacks ignore 25% of the target\'s DEF.' },
    { code: 'secra',   label: 'Sacrament',       text: 'Shorter fixed cast time.' },
    { code: 'renov',   label: 'Renovatio',       text: 'Heals 5% of max HP every 5 seconds.' },
  ]},
  { job: 'Sura', list: [
    { code: 'gtrev',   label: 'Gentle Touch – Revitalize', text: '+10% max HP and faster HP recovery.', excl: 'gt' },
    { code: 'gtchg',   label: 'Gentle Touch – Change',     text: '+40 ATK and faster attacks (more with high AGI).', excl: 'gt' },
  ]},
  { job: 'Soul Reaper', list: [
    { code: 'sshadow', label: 'Shadow Soul',     text: 'Faster attacks and +20 CRIT.', excl: 'soul' },
    { code: 'sfalcon', label: 'Falcon Soul',     text: '+50 weapon ATK and more HIT.', excl: 'soul' },
    { code: 'sfairy',  label: 'Fairy Soul',      text: '+50 MATK and shorter cast time.', excl: 'soul' },
    { code: 'sgolem',  label: 'Golem Soul',      text: '+300 DEF and +40 MDEF.', excl: 'soul' },
  ]},
];
const EXCL_NOTE = { assu: 'one of Assumptio / Kaite', gt: 'one Gentle Touch', soul: 'one of Soul Link / the Soul Reaper souls' };

const $ = id => document.getElementById(id);
const inputs = {};   // key -> checkbox ("npc:*" keys included)
let saved = {};      // what values() gave when last saved
let offExtra = [];   // names in npc_off this page does not know; kept as they are
let hasOffKey = false;
const buffBoxes = {}; // buff code -> checkbox
let buffExtra = [];  // codes in buffer_set this page does not know; kept as they are
let hasBuffKey = false;

function status(text, dirty = false) {
  $('status').textContent = text;
  $('status').className = dirty ? 'dirty' : '';
}
// What gets saved: the real boolean settings as they are, and the unticked
// always-loaded NPCs folded into the one "npc_off" string.
function values() {
  const out = {};
  const off = [];
  for (const [k, box] of Object.entries(inputs)) {
    if (k.startsWith('npc:')) { if (!box.checked) off.push(k.slice(4)); }
    else out[k] = box.checked;
  }
  if (hasOffKey) out[OFF_KEY] = [...off, ...offExtra].join(',');
  if (hasBuffKey) out[BUFF_KEY] = [...Object.keys(buffBoxes).filter(c => buffBoxes[c].checked), ...buffExtra].join(',');
  return out;
}
function markDirty() {
  const changed = Object.entries(values()).some(([k, v]) => saved[k] !== v);
  status(changed ? 'Unsaved changes' : '', changed);
}

// The group's own checkbox is worked out from its NPCs: ticked when all are
// on, half-ticked when some are, and clicking it switches them all.
function syncGroup(group) {
  const on = group.boxes.filter(b => b.checked).length;
  group.all.checked = on === group.boxes.length;
  group.all.indeterminate = on > 0 && on < group.boxes.length;
  group.count.textContent = `${on} of ${group.boxes.length} on`;
}

function drawGroup(title, settings) {
  const details = document.createElement('details');
  const summary = document.createElement('summary');
  const all = document.createElement('input');
  all.type = 'checkbox';
  const name = document.createElement('span');
  name.textContent = title;
  const count = document.createElement('span');
  count.className = 'count';
  summary.append(all, name, count);
  details.append(summary);
  const group = { all, count, boxes: [] };

  for (const s of settings) {
    const label = document.createElement('label');
    label.className = 'row';
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = s.value === true;
    const text = document.createElement('span');
    text.textContent = s.label || s.key;
    if (s.description) {
      const hint = document.createElement('small');
      hint.textContent = s.description;
      text.append(hint);
    }
    box.onchange = () => { syncGroup(group); markDirty(); };
    label.append(box, text);
    if (s.key === 'enable_buffer' && hasBuffKey) {
      const open = document.createElement('button');
      open.textContent = 'Choose buffs…';
      open.onclick = e => { e.preventDefault(); showBuffs(true); };
      text.append(open);
    }
    details.append(label);
    inputs[s.key] = box;
    group.boxes.push(box);
  }

  // Clicking the group checkbox must not also fold the group.
  all.onclick = e => e.stopPropagation();
  all.onchange = () => {
    for (const box of group.boxes) box.checked = all.checked;
    syncGroup(group);
    markDirty();
  };
  let folded = false;
  try { folded = localStorage.getItem('folded:' + title) === '1'; } catch {}
  details.open = !folded;
  details.ontoggle = () => {
    try { localStorage.setItem('folded:' + title, details.open ? '0' : '1'); } catch {}
  };
  syncGroup(group);
  $('groups').append(details);
}

// ---- Buffer page --------------------------------------------------------
function showBuffs(on) {
  $('buffs').hidden = !on;
  $('groups').hidden = on;
  document.querySelector('body > .tools').hidden = on;
  window.scrollTo(0, 0);
}
function buffCount() {
  const on = Object.values(buffBoxes).filter(b => b.checked).length;
  const btn = document.querySelector('label.row button');
  if (btn) btn.textContent = `Choose buffs… (${on})`;
}
function drawBuffs(chosen) {
  for (const g of BUFFS) {
    const details = document.createElement('details');
    details.open = true;
    const summary = document.createElement('summary');
    summary.textContent = g.job;
    details.append(summary);
    for (const b of g.list) {
      const label = document.createElement('label');
      label.className = 'row';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = chosen.includes(b.code);
      const text = document.createElement('span');
      text.textContent = b.label;
      const hint = document.createElement('small');
      hint.textContent = b.text;
      if (b.excl) {
        const w = document.createElement('span');
        w.className = 'excl';
        w.textContent = ' ⚠ ' + EXCL_NOTE[b.excl];
        hint.append(w);
      }
      text.append(hint);
      box.onchange = () => {
        if (box.checked && b.excl)
          for (const g2 of BUFFS) for (const o of g2.list)
            if (o.excl === b.excl && o.code !== b.code) buffBoxes[o.code].checked = false;
        buffCount();
        markDirty();
      };
      label.append(box, text);
      details.append(label);
      buffBoxes[b.code] = box;
    }
    $('buff-groups').append(details);
  }
  buffCount();
}
$('buffs-back').onclick = () => showBuffs(false);
$('buffs-default').onclick = () => {
  for (const [code, box] of Object.entries(buffBoxes)) box.checked = BUFF_DEFAULT.includes(code);
  buffCount();
  markDirty();
};

async function run(button, work) {
  for (const b of document.querySelectorAll('footer button')) b.disabled = true;
  try { await work(); }
  catch (e) { status('Error: ' + (e && e.message || e), true); }
  for (const b of document.querySelectorAll('footer button')) b.disabled = false;
}

async function save() {
  const v = values();
  await window.modSettings.set(v);
  saved = v;
}

(async () => {
  try {
    const mod = await window.modSettings.get();
    $('about').textContent = `version ${mod.version} · ${mod.context.era} · app ${mod.context.appVersion}`;
    if (!mod.enabled) {
      const off = document.createElement('span');
      off.className = 'off';
      off.textContent = ' · switched off in the Mods tab';
      $('about').append(off);
    }
    const byKey = new Map(mod.settings.filter(s => s.type === 'boolean').map(s => [s.key, s]));
    const offSetting = mod.settings.find(s => s.key === OFF_KEY);
    if (offSetting) {
      hasOffKey = true;
      const off = String(offSetting.value || '').split(',').map(n => n.trim()).filter(Boolean);
      offExtra = off.filter(n => !ALWAYS_LOADED['npc:' + n]);
      for (const [k, info] of Object.entries(ALWAYS_LOADED))
        byKey.set(k, { key: k, ...info, value: !off.includes(k.slice(4)) });
    }
    const buffSetting = mod.settings.find(s => s.key === BUFF_KEY);
    if (buffSetting) {
      hasBuffKey = true;
      const known = BUFFS.flatMap(g => g.list.map(b => b.code));
      const chosen = String(buffSetting.value ?? '').split(',').map(c => c.trim()).filter(Boolean);
      buffExtra = chosen.filter(c => !known.includes(c));
      drawBuffs(chosen);
    }
    for (const g of GROUPS) {
      const list = g.keys.filter(k => byKey.has(k)).map(k => byKey.get(k));
      g.keys.forEach(k => byKey.delete(k));
      if (list.length) drawGroup(g.title, list);
    }
    if (byKey.size) drawGroup('Other', [...byKey.values()]);
    if (hasBuffKey) buffCount();
    saved = values();
  } catch (e) {
    status('Could not read the settings: ' + (e && e.message || e), true);
  }
})();

$('expand').onclick = () => document.querySelectorAll('details').forEach(d => { d.open = true; });
$('collapse').onclick = () => document.querySelectorAll('details').forEach(d => { d.open = false; });

$('save').onclick = () => run($('save'), async () => {
  await save();
  status('Saved. Changes take effect when the server restarts.');
});
$('apply').onclick = () => run($('apply'), async () => {
  await save();
  status('Restarting the server…');
  await window.modSettings.apply();
  status('Saved and applied.');
});
</script>
</body>
</html>
